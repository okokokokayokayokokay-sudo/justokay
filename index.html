<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sup</title><link rel="icon" type="image/png" href="https://files.catbox.moe/dz7xt7.png"><style>@import url(https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap);*{box-sizing:border-box}html{scroll-behavior:smooth}body{background-color:#080708;color:#d6d0d0;font-family:'Cormorant Garamond',serif;text-align:center;margin:0;padding:90px 22px 70px;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;overflow-x:hidden;-webkit-font-smoothing:antialiased}body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 50% 42%,transparent 34%,#000 100%);opacity:.9}body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 90% 55% at 50% -10%,rgba(122,20,26,.2),transparent 70%),radial-gradient(ellipse 70% 40% at 50% 110%,rgba(80,18,40,.12),transparent 70%)}.wrap{position:relative;z-index:1;width:100%;max-width:660px;margin:0 auto;text-align:left}.head{text-align:center;margin-bottom:32px}h1{display:inline-block;color:#eae4e4;font-size:clamp(44px,11vw,62px);letter-spacing:10px;text-indent:10px;margin:0;min-height:1.15em}.rule{height:1px;width:0;margin:24px auto 0;background:linear-gradient(90deg,transparent,#4a2427 18%,#8b343a 50%,#4a2427 82%,transparent);transition:width 1.2s cubic-bezier(.22,.85,.2,1)}.rule.show{width:72%}p{font-size:20px;line-height:1.8;color:#b3a8a8;margin:0 0 1.5em;text-wrap:pretty}.stage p:first-child{color:#cbbfbf}.sign{color:#e6e0e0!important;font-style:italic;font-size:22px;letter-spacing:3px;margin-bottom:.4em}.face{font-family:'Cormorant Garamond','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',serif;color:#c9a2a6!important;font-size:34px;line-height:1.35;letter-spacing:1px;margin-bottom:0;opacity:.95}.caret{display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-.16em;border-radius:2px;background:#b04b56;animation:blink 1s steps(1) infinite}@keyframes blink{0%,49%{opacity:1}100%,50%{opacity:0}}.actions{margin-top:46px;text-align:center;opacity:0;transform:translateY(10px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.8,.2,1);pointer-events:none}.actions.show{opacity:1;transform:none;pointer-events:auto}button{background:linear-gradient(180deg,#191415,#110e0f);color:#c9bebe;border:1px solid #4a2427;border-radius:999px;padding:13px 34px;margin:6px;font-family:inherit;font-size:17px;letter-spacing:2.5px;cursor:pointer;transition:background .3s ease,color .3s ease,border-color .3s ease,box-shadow .35s ease,transform .25s ease}button:hover{background:linear-gradient(180deg,#2e1719,#1d1012);color:#f4e5e5;border-color:#96414a;box-shadow:0 8px 26px -8px rgba(75,23,27,.9);transform:translateY(-2px)}button:active{transform:translateY(0) scale(.985)}button:focus-visible{outline:2px solid #96414a;outline-offset:3px}#message{margin-top:30px;min-height:1.6em;color:#c1b2b2;font-size:19px;line-height:1.7;text-align:center}a{color:#b4545f;text-decoration:none;transition:color .3s ease}a:hover{color:#e88b95}.foot{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:58px;padding-bottom:6px;font-size:13px;letter-spacing:2.5px;text-transform:lowercase;color:#5d5252;opacity:0;transform:translateY(6px);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.8,.2,1);pointer-events:none}.foot.show{opacity:1;transform:none;pointer-events:auto}.foot img{width:15px;height:15px;object-fit:contain;opacity:.75;display:block}.hint{position:fixed;left:0;right:0;bottom:18px;z-index:2;font-size:12px;letter-spacing:3.5px;text-transform:uppercase;color:#574c4c;transition:opacity .8s ease;pointer-events:none}.hint.gone{opacity:0}@media (max-width:560px){body{padding:60px 20px 60px}p{font-size:19px;line-height:1.76}.face{font-size:30px}button{padding:12px 30px}}@media (prefers-reduced-motion:reduce){.caret{animation:none}.rule{transition:none;width:72%}}</style></head><body><div class="wrap"><div class="head"><h1 id="title"></h1><div class="rule" id="rule"></div></div><div class="stage" id="stage"></div><div class="actions" id="actions"><button onclick="showSoundcloud()">Soundcloud</button><p id="message"></p></div><div class="foot" id="foot"><img src="https://files.catbox.moe/dz7xt7.png" alt="butterfliez.uk"><span>butterfliez.uk</span></div></div><div class="hint" id="hint">click 2 skip this bullshiet</div><script>const lines = [
            "by the time you read this, I've hanged myself and have hopefully died, and I want you to know it was my decision. Mine, made on my own, for my own reasons so don't go handing the blame out to yourselves or whateves. I want anyone who finds this to know it was on purpose. That's why I left it here, in a website, so I wouldn't just go silently with no texts and leave you who think where I am all guessing. It feels much better for me to write it here then just tell everyone upfront, but not that i could anyway right, lol",
            "It wasn't any of your fault that I took my life. Not one of you. You were the good part. Thanks for that. I was the kinda annoying one, the one that made everything harder than it needed to be, the one who couldn't just be normal about things. I know I was exhausting. I know some of you spent energy on me you'll never get back, and I'm sorry for that.",
            "But I appreciated all of it.",
            "Cya!",
            "( ͡° ͜ʖ ͡°)👌"
        ];

        const classes = ["", "", "sign", "sign", "face"];

        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const title = document.getElementById("title");
        const stage = document.getElementById("stage");
        const actions = document.getElementById("actions");
        const hint = document.getElementById("hint");
        const rule = document.getElementById("rule");
        const foot = document.getElementById("foot");

        const caret = document.createElement("span");
        caret.className = "caret";

        let skip = reduce;
        let done = false;

        const rand = (a, b) => a + Math.random() * (b - a);
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

        document.addEventListener("click", () => { if (!done) skip = true; });
        document.addEventListener("keydown", () => { if (!done) skip = true; });
        document.addEventListener("touchstart", () => { if (!done) skip = true; }, { passive: true });

        async function typeInto(el, text, min, max) {
            el.appendChild(caret);
            for (const ch of Array.from(text)) {
                el.insertBefore(document.createTextNode(ch), caret);
                if (skip) continue;
                let delay = rand(min, max);
                if (ch === ",") delay += 90;
                if (ch === "." || ch === "!") delay += 180;
                await sleep(delay);
            }
        }

        async function run() {
            await typeInto(title, "sup", 95, 165);

            if (!skip) await sleep(520);
            rule.classList.add("show");

            if (!skip) await sleep(420);

            for (let i = 0; i < lines.length; i++) {
                const el = document.createElement("p");
                if (classes[i]) el.className = classes[i];
                stage.appendChild(el);
                await typeInto(el, lines[i], 11, 22);
                if (!skip) await sleep(340);
            }

            caret.remove();
            hint.classList.add("gone");
            done = true;
            actions.classList.add("show");
            foot.classList.add("show");
        }

        window.addEventListener("load", () => {
            if (reduce) {
                title.textContent = "sup";
                lines.forEach((text, i) => {
                    const el = document.createElement("p");
                    if (classes[i]) el.className = classes[i];
                    el.textContent = text;
                    stage.appendChild(el);
                });
                rule.classList.add("show");
                hint.classList.add("gone");
                done = true;
                actions.classList.add("show");
                foot.classList.add("show");
            } else {
                run();
            }
        });

        function showSoundcloud() {
            document.getElementById("message").innerHTML =
                'My music, id like if u check it out :) ' +
                '<a href="https://soundcloud.com/strange-forces" target="_blank" rel="noopener">Strange Forces</a>';
        }</script></body></html>
