e-height:1.8;color:#b3a8a8;margin:0 0 1.5em;text-wrap:pretty}.stage p:first-child{color:#cbbfbf}.sign{color:#e6e0e0!important;font-style:italic;font-size:22px;letter-spacing:3px;margin-bottom:.4em}.face{font-family:'Cormorant Garamond','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',serif;color:#c9a2a6!important;font-size:34px;line-height:1.35;letter-spacing:1px;margin-bottom:0;opacity:.95}.caret{display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-.16em;border-radius:2px;background:#b04b56;animation:blink 1s steps(1) infinite}@keyframes blink{0%,49%{opacity:1}100%,50%{opacity:0}}.actions{margin-top:46px;text-align:center;opacity:0;transform:translateY(10px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.8,.2,1);pointer-events:none}.actions.show{opacity:1;transform:none;pointer-events:auto}button{background:linear-gradient(180deg,#191415,#110e0f);color:#c9bebe;border:1px solid #4a2427;border-radius:999px;padding:13px 34px;margin:6px;font-family:inherit;font-size:17px;letter-spacing:2.5px;cursor:pointer;transition:background .3s ease,color .3s ease,border-color .3s ease,box-shadow .35s ease,transform .25s ease}button:hover{background:linear-gradient(180deg,#2e1719,#1d1012);color:#f4e5e5;border-color:#96414a;box-shadow:0 8px 26px -8px rgba(75,23,27,.9);transform:translateY(-2px)}button:active{transform:translateY(0) scale(.985)}button:focus-visible{outline:2px solid #96414a;outline-offset:3px}#message{margin:30px auto 0;max-width:440px;min-height:0;padding:0;opacity:0;max-height:0;overflow:hidden;color:#c1b2b2;font-size:19px;line-height:1.7;text-align:center;border:1px solid transparent;background:rgba(13,9,10,.75);transition:opacity .4s ease,max-height .4s ease,padding .4s ease,border-color .4s ease}#message.show{opacity:1;max-height:180px;padding:22px;border-color:#492329;box-shadow:0 0 24px rgba(75,23,27,.16)}#message a{color:#b4545f;display:inline-block;margin-top:8px}#message a:hover{color:#e88b95}.foot{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:58px;padding-bottom:6px;font-size:13px;letter-spacing:2.5px;text-transform:lowercase;color:#5d5252;opacity:0;transform:translateY(6px);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.8,.2,1);pointer-events:none}.foot.show{opacity:1;transform:none;pointer-events:auto}.foot img{width:15px;height:15px;object-fit:contain;opacity:.75;display:block}.hint{position:fixed;left:0;right:0;bottom:18px;z-index:2;font-size:12px;letter-spacing:3.5px;text-transform:uppercase;color:#574c4c;transition:opacity .8s ease;pointer-events:none}.hint.gone{opacity:0}@media (max-width:560px){body{padding:60px 20px 60px}p{font-size:19px;line-height:1.76}.lock p{font-size:20px;line-height:1.95}.lock .when{font-size:21px;margin:12px 0 14px}.face{font-size:30px}button{padding:12px 30px}}@media (prefers-reduced-motion:reduce){.caret{animation:none}.rule{transition:none;width:72%}}</style><div class=lock id=lock><p><span class=head-line>Please wait until the date</span> <span class=when id=when>November 22nd, 2026 at 12:22 PM</span> <span class=tail>to open, it's quite important just so you know where I've gone :)</span></div><div class=wrap id=wrap hidden><div class=head><h1 id=title></h1><div class=rule id=rule></div></div><div class=stage id=stage></div><div class=actions id=actions><button onclick=showSoundcloud()>Soundcloud</button> <button onclick=showSpotify()>Spotify</button><div id=message></div></div><div class=foot id=foot><img alt=butterfliez.uk src=https://files.catbox.moe/dz7xt7.png> <span>butterfliez.uk</span></div></div><div class=hint id=hint hidden>click 2 skip this bullshiet</div><script>const UNLOCK = new Date(2026, 10, 22, 12, 22, 0, 0);

    const lines = ["by the time you read this, I've hanged myself or drank a shit ton of pesticide, and have hopefully died, and I want you to know it was my decision. Mine, made on my own, for my own reasons so don't go handing the blame out to yourselves or whateves. I want anyone who finds this to know it was on purpose. That's why I left it here, in a website, so I wouldn't just go silently with no texts and leave you who think where I am all guessing. It feels much better for me to write it here then just tell everyone upfront, but not that i could anyway right, lol", "It wasn't any of your fault that I took my life. Not one of you. You were the good part. Thanks for that. I was the kinda annoying one, the one that made everything harder than it needed to be, the one who couldn't just be normal about things. I know I was exhausting. I know some of you spent energy on me you'll never get back, and I'm sorry for that.", "But I appreciated all of it.", "Cya!", "( ͡° ͜ʖ ͡°)👌"];
    const classes = ["", "", "sign", "sign", "face"];
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const lock = document.getElementById("lock");
    const when = document.getElementById("when");
    const wrap = document.getElementById("wrap");
    const title = document.getElementById("title");
    const stage = document.getElementById("stage");
    const actions = document.getElementById("actions");
    const hint = document.getElementById("hint");
    const rule = document.getElementById("rule");
    const foot = document.getElementById("foot");
    const message = document.getElementById("message");

    const caret = document.createElement("span");
    caret.className = "caret";

    let skip = reduce;
    let done = false;
    let started = false;

    const rand = (a, b) => a + Math.random() * (b - a);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    when.textContent = UNLOCK.toLocaleString(undefined, {
      month: "long",
      day: "numeric",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit"
    });

    const isLocked = () => Date.now() < UNLOCK.getTime();

    document.addEventListener("click", () => {
      if (started && !done) skip = true;
    });

    document.addEventListener("keydown", () => {
      if (started && !done) skip = true;
    });

    document.addEventListener("touchstart", () => {
      if (started && !done) skip = true;
    }, {
      passive: true
    });

    async function typeInto(el, text, min, max) {
      el.appendChild(caret);

      for (const ch of Array.from(text)) {
        el.insertBefore(document.createTextNode(ch), caret);
        if (skip) continue;

        let delay = rand(min, max);
        if (ch === ",") delay += 90;
        if (ch === "." || ch === "!") delay += 180;

        await sleep(delay);
      }
    }

    async function run() {
      await typeInto(title, "sup", 95, 165);
      if (!skip) await sleep(520);

      rule.classList.add("show");
      if (!skip) await sleep(420);

      for (let i = 0; i < lines.length; i++) {
        const el = document.createElement("p");
        if (classes[i]) el.className = classes[i];

        stage.appendChild(el);
        await typeInto(el, lines[i], 11, 22);

        if (!skip) await sleep(340);
      }

      caret.remove();
      hint.classList.add("gone");
      done = true;
      actions.classList.add("show");
      foot.classList.add("show");
    }

    function startExperience() {
      if (started) return;
      started = true;
      skip = reduce;

      lock.hidden = true;
      wrap.hidden = false;
      hint.hidden = false;

      window.scrollTo(0, 0);

      if (reduce) {
        title.textContent = "sup";

        lines.forEach((text, i) => {
          const el = document.createElement("p");
          if (classes[i]) el.className = classes[i];
          el.textContent = text;
          stage.appendChild(el);
        });

        rule.classList.add("show");
        hint.classList.add("gone");
        done = true;
        actions.classList.add("show");
        foot.classList.add("show");
      } else {
        run();
      }
    }

    function armUnlock() {
      if (!isLocked()) {
        startExperience();
        return;
      }

      const tick = setInterval(() => {
        if (!isLocked()) {
          clearInterval(tick);
          startExperience();
        }
      }, 1000);

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && !isLocked()) {
          clearInterval(tick);
          startExperience();
        }
      });
    }

    if (isLocked()) {
      armUnlock();
    } else {
      startExperience();
    }

    function showSoundcloud() {
      message.innerHTML = 'My music, id like if u check it out :)<br><a href="https://soundcloud.com/strange-forces" target="_blank" rel="noopener">Strange Forces</a>';
      message.classList.add("show");
    }

    function showSpotify() {
      message.innerHTML = 'My Spotify profile :)<br><a href="https://open.spotify.com/user/31kqfxzy5x2qm2uov2beyngguosu" target="_blank" rel="noopener">Spotify</a>';
      message.classList.add("show");
    }</script>
