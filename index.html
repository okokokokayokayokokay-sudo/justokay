<script>document.write("\u003c\u0021\u0064\u006f\u0063\u0074\u0079\u0070\u0065\u0068\u0074\u006d\u006c\u003e\u003c\u0068\u0074\u006d\u006c\u0020\u006c\u0061\u006e\u0067\u003d\u0065\u006e\u003e\u003c\u006d\u0065\u0074\u0061\u0020\u0063\u0068\u0061\u0072\u0073\u0065\u0074\u003d\u0055\u0054\u0046\u002d\u0038\u003e\u003c\u006d\u0065\u0074\u0061\u0020\u0063\u006f\u006e\u0074\u0065\u006e\u0074\u003d\u0022\u0077\u0069\u0064\u0074\u0068\u003d\u0064\u0065\u0076\u0069\u0063\u0065\u002d\u0077\u0069\u0064\u0074\u0068\u002c\u0069\u006e\u0069\u0074\u0069\u0061\u006c\u002d\u0073\u0063\u0061\u006c\u0065\u003d\u0031\u0022\u006e\u0061\u006d\u0065\u003d\u0076\u0069\u0065\u0077\u0070\u006f\u0072\u0074\u003e\u003c\u0074\u0069\u0074\u006c\u0065\u003e\u0068\u0065\u006c\u006c\u006f\u003c\u002f\u0074\u0069\u0074\u006c\u0065\u003e\u003c\u0073\u0074\u0079\u006c\u0065\u003e\u0040\u0069\u006d\u0070\u006f\u0072\u0074\u0020\u0075\u0072\u006c\u0028\u0068\u0074\u0074\u0070\u0073\u003a\u002f\u002f\u0066\u006f\u006e\u0074\u0073\u002e\u0067\u006f\u006f\u0067\u006c\u0065\u0061\u0070\u0069\u0073\u002e\u0063\u006f\u006d\u002f\u0063\u0073\u0073\u0032\u003f\u0066\u0061\u006d\u0069\u006c\u0079\u003d\u0043\u006f\u0072\u006d\u006f\u0072\u0061\u006e\u0074\u002b\u0047\u0061\u0072\u0061\u006d\u006f\u006e\u0064\u003a\u0077\u0067\u0068\u0074\u0040\u0034\u0030\u0030\u003b\u0035\u0030\u0030\u003b\u0036\u0030\u0030\u003b\u0037\u0030\u0030\u0026\u0064\u0069\u0073\u0070\u006c\u0061\u0079\u003d\u0073\u0077\u0061\u0070\u0029\u003b\u0062\u006f\u0064\u0079\u007b\u0062\u0061\u0063\u006b\u0067\u0072\u006f\u0075\u006e\u0064\u002d\u0063\u006f\u006c\u006f\u0072\u003a\u0023\u0030\u0039\u0030\u0038\u0030\u0039\u003b\u0063\u006f\u006c\u006f\u0072\u003a\u0023\u0064\u0036\u0064\u0030\u0064\u0030\u003b\u0066\u006f\u006e\u0074\u002d\u0066\u0061\u006d\u0069\u006c\u0079\u003a\u0027\u0043\u006f\u0072\u006d\u006f\u0072\u0061\u006e\u0074\u0020\u0047\u0061\u0072\u0061\u006d\u006f\u006e\u0064\u0027\u002c\u0073\u0065\u0072\u0069\u0066\u003b\u
